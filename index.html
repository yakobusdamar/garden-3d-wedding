<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Petalbrook — Nana &amp; Raka's Wedding</title>
  <meta name="description" content="A little village, a big day. Walk around Petalbrook to find the story, the details, and your invitation to Nana & Raka's wedding." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <!-- ============ 3D WORLD ============ -->
  <canvas id="world" aria-hidden="true"></canvas>
  <div id="vignette" aria-hidden="true"></div>

  <!-- ============ TITLE SCREEN ============ -->
  <div id="title-screen" class="screen">
    <div class="title-sky" aria-hidden="true"></div>
    <div class="title-hills" aria-hidden="true"></div>
    <div class="title-card">
      <p class="title-eyebrow">You are invited to the farm wedding of</p>
      <h1 class="title-names"><span class="title-name">Nana</span><span class="title-amp">&amp;</span><span class="title-name">Raka</span></h1>
      <p class="title-date">Saturday · November 21, 2026</p>
      <button id="btn-start" class="btn btn-gold" type="button">Open the gate</button>
      <p class="title-hint">best with sound · works with keys or touch</p>
    </div>
  </div>

  <!-- ============ HUD ============ -->
  <div id="hud" class="hidden" aria-hidden="true">
    <div id="hud-date" class="wood-frame chip" role="status">
      <span class="chip-season">Autumn</span>
      <span class="chip-day">Day 1</span>
      <span class="chip-clock">10:20 AM</span>
    </div>

    <div id="hud-title" class="wood-frame chip">
      <span class="hud-couple">Nana <svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21C6.5 16.8 3 13.6 3 9.9 3 7.2 5.1 5 7.8 5c1.7 0 3.2.9 4.2 2.2C13 5.9 14.5 5 16.2 5 18.9 5 21 7.2 21 9.9c0 3.7-3.5 6.9-9 11.1z"/></svg> Raka</span>
    </div>

    <div id="hud-buttons">
      <button id="btn-music" class="icon-btn" type="button" aria-label="Toggle music" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="18" cy="16" r="3" fill="currentColor"/></svg>
      </button>
      <button id="btn-help" class="icon-btn" type="button" aria-label="Help and controls" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24"><path d="M9 9a3 3 0 1 1 4.6 2.5c-1 .7-1.6 1.2-1.6 2.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="17.5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>
      </button>
    </div>

    <div id="hotbar" class="wood-frame" aria-label="Discovered places — click to travel"></div>

    <div id="toast" class="wood-frame hidden"></div>
  </div>

  <!-- ============ DIALOGUE BOX ============ -->
  <div id="dialogue" class="hidden" role="dialog" aria-live="polite" aria-label="Conversation">
    <div class="dlg-portrait" id="dlg-portrait" aria-hidden="true"></div>
    <div class="dlg-frame wood-frame">
      <div class="dlg-name" id="dlg-name">Nana</div>
      <p class="dlg-text" id="dlg-text"></p>
      <div class="dlg-choices" id="dlg-choices"></div>
      <span class="dlg-next" id="dlg-next" aria-hidden="true">▼</span>
    </div>
  </div>

  <!-- ============ MODALS ============ -->
  <div id="modal-root" class="hidden" role="dialog" aria-modal="true">
    <div id="modal-backdrop"></div>
    <div id="modal-panel" class="wood-frame" role="document"></div>
  </div>

  <!-- ============ TOUCH CONTROLS ============ -->
  <div id="touch-ui" class="hidden">
    <div id="joystick" aria-hidden="true">
      <div id="joy-knob"></div>
    </div>
    <button id="btn-act" class="btn btn-gold" type="button" aria-label="Interact">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5c-4.7 0-8.5 3.3-8.5 7.4 0 2.3 1.2 4.4 3.1 5.8L5.5 20.5l4-1.6c.8.2 1.6.3 2.5.3 4.7 0 8.5-3.3 8.5-7.4S16.7 3.5 12 3.5z" fill="currentColor" opacity=".22" stroke="none"/><path d="M12 3.5c-4.7 0-8.5 3.3-8.5 7.4 0 2.3 1.2 4.4 3.1 5.8L5.5 20.5l4-1.6c.8.2 1.6.3 2.5.3 4.7 0 8.5-3.3 8.5-7.4S16.7 3.5 12 3.5z"/><path d="M8.7 10.6h6.6M8.7 13.6h4.2" stroke-width="2"/></svg>
      <span class="act-label" id="act-label">Read</span>
    </button>
  </div>

  <script>
    // keep module-load errors visible in __errs for quick diagnosis
    window.__errs = [];
    window.addEventListener("error", (e) => window.__errs.push(String(e.message)));
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
